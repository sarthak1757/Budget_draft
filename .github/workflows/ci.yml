# Runs on every push and pull request: install, typecheck, every test, build.
# main deploys straight to Render, so a red run here means "don't ship".
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26.7.0 # same as render.yaml
          cache: npm

      # The server tests start a throwaway MongoDB (mongodb-memory-server).
      # Cache its download so each run doesn't fetch it again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
